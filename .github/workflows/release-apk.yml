# [Manosaba] RELEASE_VERSION 파일의 버전(예: 0.2)을 바꿔 main에 올리면 GitHub이 APK를 빌드해서
# Releases에 v0.2 태그로 자동으로 올림.
# 서명 키는 저장소에 올리지 않고, 저장소 Settings > Secrets and variables > Actions 에 넣어 둔 값을 씀.
#   MANOSABA_KEYSTORE_BASE64 : manosaba.keystore 파일을 base64로 바꾼 글자
#   MANOSABA_STORE_PASSWORD  : keystore.properties의 storePassword
#   MANOSABA_KEY_ALIAS       : keystore.properties의 keyAlias
#   MANOSABA_KEY_PASSWORD    : keystore.properties의 keyPassword
name: Release APK

on:
  push:
    branches:
      - main
    paths:
      - RELEASE_VERSION
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MANOSABA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MANOSABA_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MANOSABA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MANOSABA_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::서명 키 Secret(MANOSABA_KEYSTORE_BASE64)이 없습니다. 저장소 Settings > Secrets 에 먼저 넣어 주세요."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > manosaba-ci.keystore
          {
            echo "storeFile=manosaba-ci.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew android:assembleRelease --no-daemon

      - name: Rename APK
        run: |
          TAG="v$(tr -d '[:space:]' < RELEASE_VERSION)"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          cp android/build/outputs/apk/release/android-release.apk "ManosabaPixelDungeon-${TAG}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Manosaba Pixel Dungeon ${{ env.TAG }}
          files: ManosabaPixelDungeon-${{ env.TAG }}.apk
          generate_release_notes: true

      - name: Remove signing key
        if: always()
        run: rm -f manosaba-ci.keystore keystore.properties
